# Local development infrastructure. Production uses managed services (see docs/02-system-architecture.md §8).
name: nxtwave-prep

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    ports:
      - "45432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d prep"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every email sent in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
